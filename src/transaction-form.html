<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    WEEK 4 — SESSION 1 LIVE DEMO
    Goal: move from Week 3 transaction design to a clean semantic HTML page.

    Teaching focus:
    1. Basic HTML document structure
    2. Elements + nesting
    3. Semantic HTML
    4. Attributes
    5. Edit → Save → Refresh → Verify
  -->

  <meta charset="UTF-8">

  <!-- Helps the page display properly on different screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Appears in the browser tab -->
  <title>Academic-Request</title>
</head>

<body>

  <!--
    <header> = introductory area of the page.
    It communicates the purpose of the page.
  -->
  <header>
    <h1>Academic Advising</h1>
    <p>Submit a request for an advising appointment</p>
  </header>

  <!--
    <main> = the primary content of this page.
    A page should normally have one main content region.
  -->
  <main>

    <!--
      <section> groups related content.
      This first section gives instructions before the transaction form.
    -->
    <section>
      <h2>Before You Submit</h2>
      <p>Please have your student ID, reason for visit, specific academic advisor, and date/time prepared</p>
    </section>

    <!--
      This second section represents the future transaction-entry area.

      In Session 1, we stop at structure.
      In Session 2, we will place the actual <form> and controls here.
    -->
    <section>
      <h2>Appointment Details</h2>

      <p>
        The transaction form will be added here in Session 2.
      </p>
    </section>

  </main>

  <!--
    <footer> = supporting or closing information.
    It is not the main transaction content.
  -->
  <footer>
    <p>MIS 3371 — Week 4 Live Demo</p>
  </footer>

</body>
</html>
